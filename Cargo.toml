[package]
name = "wplc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
encoding_rs = "0.8"
opcua = { package = "async-opcua", version = "0.19", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasmi = "2.0.0"
wat = "1"
ratatui = "0.30.2"

[profile.release]
lto = "thin"
